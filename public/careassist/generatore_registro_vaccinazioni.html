<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro Ufficiale Vaccinazioni Antinfluenzali A4</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 8mm 10mm 10mm 10mm;
    }
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #000000;
      background: #f8fafc;
    }

    /* PANNELLO MOBILE & DESKTOP OTTIMIZZATO PER SMARTPHONE */
    .doctor-panel {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 14px 18px;
      margin: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      border-bottom: 3px solid #0284c7;
      position: sticky;
      top: 0;
      z-index: 99999;
    }
    .doctor-panel-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 900px) {
      .doctor-panel-inner {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-title h1 {
      margin: 0;
      font-size: 16px;
      color: #38bdf8;
      font-weight: 900;
      letter-spacing: -0.2px;
    }
    .panel-title span {
      font-size: 11.5px;
      color: #94a3b8;
    }

    .panel-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .control-group label {
      font-size: 10px;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .control-group select,
    .control-group input {
      background: #0f172a;
      border: 1.5px solid #38bdf8;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      outline: none;
      height: 36px;
    }
    .control-group input[type="number"] {
      width: 80px;
      text-align: center;
    }

    .btn-print-action {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      padding: 0 18px;
      height: 36px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(16,185,129,0.35);
      margin-top: auto;
    }

    /* CONTENITORE FOGLI CON SCROLL ORIZZONTALE FLUIDO SU SMARTPHONE */
    .preview-scroll-wrapper {
      width: 100%;
      overflow-x: auto;
      padding: 15px 10px 40px 10px;
      -webkit-overflow-scrolling: touch;
    }

    .printable-sheet-container {
      width: 297mm;
      min-width: 297mm;
      margin: 0 auto 20px auto;
      background: #ffffff;
      padding: 8mm 10mm;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      border-radius: 4px;
    }

    .page-break {
      page-break-after: always;
      break-after: page;
      margin-bottom: 25px;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-bottom: 3px;
    }
    .asl-logo-area {
      font-size: 12px;
      font-weight: bold;
    }
    .titolo-campagna {
      text-align: center;
      font-size: 14.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex: 1;
    }
    .stagione-box {
      font-size: 14px;
      font-weight: bold;
      text-decoration: underline;
    }
    .dott-box {
      font-size: 11px;
      font-weight: bold;
      color: #1e293b;
      text-align: right;
    }
    
    /* TABELLA REGISTRO CON MISURE PRECISE MILLIMETRICHE */
    table.registro-vaccini {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.registro-vaccini th,
    table.registro-vaccini td {
      border: 1px solid #000000;
      padding: 0 4px;
      font-size: 10px;
      vertical-align: middle;
      text-align: center;
    }
    table.registro-vaccini th {
      background-color: #f1f5f9;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 9px;
      padding: 5px 2px;
      line-height: 1.2;
    }

    /* ALTEZZA RIGHE: 14.2 mm PER FETTA ADESIVA VACCINO */
    table.registro-vaccini tbody tr {
      height: 14.2mm;
    }

    /* LARGHEZZA COLONNE */
    .col-n { width: 32px; font-weight: bold; font-size: 11px; }
    .col-data { width: 66px; }
    .col-cognome { width: 115px; }
    .col-nome { width: 115px; }
    .col-nascita { width: 75px; }
    .col-residenza { width: 110px; }

    /* COLONNA TALLONCINO VACCINO: CALIBRATA RIGIDAMENTE A 52mm */
    .col-talloncino { 
      width: 52mm; 
      min-width: 52mm;
      max-width: 52mm;
      background-color: #fafafa;
    }

    .col-eta { width: 42px; }
    .col-patologia { width: 110px; }
    .col-firma { width: 130px; }

    .talloncino-placeholder {
      font-size: 7.5px;
      color: #94a3b8;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border: 1px dashed #cbd5e1;
      border-radius: 3px;
      height: 10.5mm;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1px auto;
      width: 48mm;
    }

    .footer-page {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 11.5px;
      font-weight: bold;
      padding-right: 15px;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .doctor-panel {
        display: none !important;
      }
      .preview-scroll-wrapper {
        padding: 0;
        overflow: visible;
      }
      .printable-sheet-container {
        padding: 0;
        box-shadow: none;
        margin: 0;
        width: 100%;
        min-width: 100%;
      }
      .talloncino-placeholder {
        border: none !important;
        color: transparent !important;
      }
    }
  </style>
</head>
<body>

  <!-- PANNELLO DI CONTROLLO INTERATTIVO PER IL MEDICO (ADATTABILE SMARTPHONE) -->
  <div class="doctor-panel">
    <div class="doctor-panel-inner">
      <div class="panel-title">
        <span style="font-size:24px;">💉</span>
        <div>
          <h1>Registro Vaccinazioni Medico</h1>
          <span>Imposta numeri e stampa in A4</span>
        </div>
      </div>

      <div class="panel-controls">
        
        <!-- OPZIONE 1: TIPO DI NUMERAZIONE -->
        <div class="control-group">
          <label>Numerazione</label>
          <select id="sel-tipo-numerazione" onchange="rigeneraPagineRegistro()">
            <option value="continua">Personalizzata (1, 17, 33...)</option>
            <option value="bianca">Casella N. Vuota (A mano)</option>
          </select>
        </div>

        <!-- OPZIONE 2: NUMERO DI PARTENZA -->
        <div class="control-group" id="group-partenza">
          <label>Inizia da N.</label>
          <input type="number" id="inp-numero-inizio" value="1" min="1" max="999" oninput="rigeneraPagineRegistro()">
        </div>

        <!-- OPZIONE 3: QUANTE PAGINE STAMPARE -->
        <div class="control-group">
          <label>Pagine</label>
          <select id="sel-num-pagine" onchange="rigeneraPagineRegistro()">
            <option value="1">1 Pag (16)</option>
            <option value="2">2 Pag (32)</option>
            <option value="3">3 Pag (48)</option>
            <option value="4">4 Pag (64)</option>
            <option value="5">5 Pag (80)</option>
          </select>
        </div>

        <!-- OPZIONE 4: NUMERO PAGINA IN BASSO -->
        <div class="control-group" id="group-pag-inizio">
          <label>Inizia da Pag.</label>
          <input type="number" id="inp-pag-inizio" value="1" min="1" max="99" oninput="rigeneraPagineRegistro()">
        </div>

        <!-- OPZIONE 5: NOME DOTTORESSA -->
        <div class="control-group">
          <label>Dott.ssa / Medico</label>
          <input type="text" id="inp-nome-medico" placeholder="Dott.ssa ..." value="" oninput="aggiornaDicituraMedico()">
        </div>

        <!-- BOTTONE DI STAMPA A4 -->
        <button type="button" class="btn-print-action" onclick="window.print()">
          <span>🖨️</span> Stampa A4 / PDF
        </button>

      </div>
    </div>
  </div>

  <!-- CONTENITORE DOVE VENGONO GENERATE LE PAGINE A4 -->
  <div class="preview-scroll-wrapper">
    <div id="sheets-render-root">
      <!-- Generato dinamicamente via JavaScript -->
    </div>
  </div>

  <script>
    function generaSingolaPaginaHTML(numeroIniziale, tipoNumerazione, paginaCorrente, pagineTotali, nomeMedico) {
      let righeHTML = '';
      const righePerFoglio = 16;

      for (let i = 0; i < righePerFoglio; i++) {
        let numeroCella = '';
        if (tipoNumerazione === 'continua') {
          numeroCella = numeroIniziale + i;
        } else {
          numeroCella = '';
        }

        righeHTML += `
          <tr>
            <td class="col-n">${numeroCella}</td>
            <td class="col-data"></td>
            <td class="col-cognome"></td>
            <td class="col-nome"></td>
            <td class="col-nascita"></td>
            <td class="col-residenza"></td>
            <td class="col-talloncino">
              <div class="talloncino-placeholder">Fustella Vaccino (52mm)</div>
            </td>
            <td class="col-eta"></td>
            <td class="col-patologia"></td>
            <td class="col-firma"></td>
          </tr>
        `;
      }

      const medicoTxt = nomeMedico ? `Medico: <b>${nomeMedico}</b>` : `MOD. VACC. ADI / MMG`;

      return `
        <div class="printable-sheet-container ${paginaCorrente < pagineTotali ? 'page-break' : ''}">
          <!-- INTESTAZIONE -->
          <div class="header-container">
            <div class="asl-logo-area">
              <span style="border: 1.5px solid #000; padding: 2px 6px; border-radius: 4px; font-size: 11px;">REGIONE / ASL</span>
            </div>
            <div class="titolo-campagna">
              CAMPAGNA VACCINAZIONE ANTINFLUENZALE STAGIONE <span class="stagione-box">2025/2026</span>
            </div>
            <div class="dott-box">
              ${medicoTxt}
            </div>
          </div>

          <!-- TABELLA -->
          <table class="registro-vaccini">
            <thead>
              <tr>
                <th class="col-n">N.</th>
                <th class="col-data">DATA</th>
                <th class="col-cognome">COGNOME</th>
                <th class="col-nome">NOME</th>
                <th class="col-nascita">DATA<br>DI NASCITA</th>
                <th class="col-residenza">RESIDENZA</th>
                <th class="col-talloncino">
                  FLUAD / EFLUELDA /<br>VAXIGRIP TETRA<br>
                  <span style="font-size: 7px; font-weight: normal; color: #555;">(Spazio Fustella Adesiva)</span>
                </th>
                <th class="col-eta">ETA'<br>(SI/NO)</th>
                <th class="col-patologia">PATOLOGIA</th>
                <th class="col-firma">FIRMA DOPO LETTURA<br>CONSENSO INFORMATO</th>
              </tr>
            </thead>
            <tbody>
              ${righeHTML}
            </tbody>
          </table>

          <!-- FOOTER -->
          <div class="footer-page">
            PAG. &nbsp; <u>&nbsp; ${paginaCorrente} &nbsp;</u> &nbsp; / &nbsp; <u>&nbsp; ${pagineTotali} &nbsp;</u>
          </div>
        </div>
      `;
    }

    function rigeneraPagineRegistro() {
      const tipo = document.getElementById('sel-tipo-numerazione').value;
      const numInizio = parseInt(document.getElementById('inp-numero-inizio').value, 10) || 1;
      const numPagine = parseInt(document.getElementById('sel-num-pagine').value, 10) || 1;
      const pagInizio = parseInt(document.getElementById('inp-pag-inizio').value, 10) || 1;
      const nomeMedico = (document.getElementById('inp-nome-medico').value || '').trim();

      const groupPartenza = document.getElementById('group-partenza');
      if (groupPartenza) {
        groupPartenza.style.display = (tipo === 'continua') ? 'flex' : 'none';
      }

      const container = document.getElementById('sheets-render-root');
      let fullHtml = '';

      const totalePagine = pagInizio + numPagine - 1;

      for (let p = 0; p < numPagine; p++) {
        const curPagNum = pagInizio + p;
        const curStartProg = numInizio + (p * 16);
        fullHtml += generaSingolaPaginaHTML(curStartProg, tipo, curPagNum, totalePagine, nomeMedico);
      }

      container.innerHTML = fullHtml;
    }

    function aggiornaDicituraMedico() {
      rigeneraPagineRegistro();
    }

    window.addEventListener('DOMContentLoaded', () => {
      rigeneraPagineRegistro();
    });
  </script>

</body>
</html>
